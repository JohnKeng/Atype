name: Atype
options:
  bundleIdPrefix: com.atype
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83JDL9KX23
    CODE_SIGN_STYLE: Automatic
packages:
  AtypeCore:
    path: AtypeCore
targets:
  Atype:
    type: application
    platform: iOS
    sources:
      - path: Atype
    dependencies:
      - package: AtypeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atype.ios
        INFOPLIST_FILE: Atype/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Atype/Resources/Atype.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
